[project]
name = "viperai"
version = "0.1.0"
description = "Prototype LLM agent for automated reconnaissance and scanning (WIP)"
authors = [
    { name = "Rayen Guedria", email = "rayenguedria12@gmail.com" },
    { name = "Oussama", email = "oussama@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "google-generativeai (>=0.8.5,<0.9.0)"
]

[tool.poetry]
packages = [{ include = "viperai", from = "src" }]

[tool.poetry.scripts]
viperai = "viperai.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"